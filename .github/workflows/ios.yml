name: MIND iOS

on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "mind/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Upload build to TestFlight"
        required: false
        default: "false"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build (and TestFlight on demand)
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mind
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner info
        run: |
          set -ex
          sw_vers
          xcodebuild -version
          xcrun simctl list runtimes
          which brew && brew --version

      - name: Select Xcode with iOS 26 SDK
        run: |
          set -ex
          # Print every Xcode the runner image ships with so the log shows
          # what was available if this step ever fails.
          ls -d /Applications/Xcode*.app 2>/dev/null || true

          SELECTED=""
          # Sort reverse so we try the newest Xcode first.
          for xc in $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -r); do
            if "$xc/Contents/Developer/usr/bin/xcodebuild" -showsdks 2>/dev/null \
                | grep -qi "iphoneos26"; then
              SELECTED="$xc"
              break
            fi
          done

          if [ -z "$SELECTED" ]; then
            echo "::error::No Xcode with iOS 26 SDK found on this runner image."
            echo "Available SDKs by Xcode:"
            for xc in $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -r); do
              echo "  $xc:"
              "$xc/Contents/Developer/usr/bin/xcodebuild" -showsdks 2>/dev/null \
                | grep iphoneos | sed 's/^/    /' || echo "    (none)"
            done
            exit 1
          fi

          sudo xcode-select -s "$SELECTED"
          echo "Selected: $SELECTED"
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos

      - name: Install Tuist
        run: |
          set -ex
          brew install tuist
          tuist version

      - name: Install xcbeautify
        run: |
          set -ex
          brew install xcbeautify
          xcbeautify --version

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: mind

      - name: Generate Xcode project
        run: |
          set -ex
          tuist generate --no-open
          ls -la

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Build (no signing)
        run: |
          set -ex
          set -o pipefail
          xcodebuild \
            -project MIND.xcodeproj \
            -scheme MIND \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -sdk iphonesimulator \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | xcbeautify --renderer github-actions

      - name: Deploy to TestFlight
        if: ${{ github.event.inputs.deploy == 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          ITC_TEAM_ID: ${{ secrets.ITC_TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bundle exec fastlane beta
